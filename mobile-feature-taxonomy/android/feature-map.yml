# Attributes Firefox for Android source files (Fenix + android-components) to features in ../features.yml.
# Same rules as the iOS map: the most specific matching rule wins; an exact file path beats a glob, and among
# globs the one with more literal path segments wins. Rule order does not matter.
# `by: ai` = generated, not yet reviewed by a person. Delete it once checked. See ../README.md.
#
# First pass generated 2026-10-27 against mozilla-firefox/firefox main (checked out 2026-10-20).

platform: android
repo: mozilla-firefox/firefox
# Rule paths and roots are relative to this directory of the repo.
base: mobile/android
extensions: [".kt", ".java"]
# Only production code: files must live under a src/main/ directory (skips src/test, src/androidTest…).
require_path_segment: src/main
skip_dirs: [build]
# Layer column in files/lines/coverage output.
layers:
  fenix/: Fenix
  android-components/: AC

roots:
  - fenix/app/src/main/java
  - android-components/components

rules:
