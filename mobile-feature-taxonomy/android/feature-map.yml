  - {path: "fenix/app/src/main/java/org/mozilla/fenix/debugsettings/**", feature: EXCLUDED, by: ai}
  - {path: "fenix/app/src/main/java/org/mozilla/fenix/e2e/**", feature: EXCLUDED, by: ai}
  - {path: "fenix/app/src/main/java/org/mozilla/fenix/automation/**", feature: EXCLUDED, by: ai}
