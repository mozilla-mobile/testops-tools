# Feature IDs used by ios/feature-map.yml and android/feature-map.yml, and by every report
# that groups by feature. IDs form the Firefox Mobile feature taxonomy (iOS and Android)
# and must stay stable; rename `name`, never `id`. Whether a feature exists on a platform
# isn't recorded here: it's derived from whether that platform's feature map assigns code to it.
#
# Imported from firefox-ios branch feature-coverage-map, commit a0be3389bf.

