# Firefox for iOS bugs → feature IDs (features.yml), read by bugs_map.py.
#
# firefox-ios issues carry no feature labels, and title rules alone get the feature right for only ~40% of bugs, so
# every escaped bug gets its feature by hand. New bugs: a comment on the issue by a team member,
#     Feature affected: Toolbar & address bar layout (UI.TB)
# (wins over this file). `issues:` below holds the decisions made before comments existed (issue number → feature
# ID, or `{excluded: reason}`). `bugs_map.py ios check` fails while an escaped bug has neither and prints the comment
# to post, with a suggestion from `title_hints`. Undecided bugs count as untriaged, never with a guessed feature.
#
# Seeded from the Testing Assessment's manual classification of 2026-01-01 → 2026-10-27 (classify.py + orla_map.py).

platform: ios
source: github
repo: mozilla-mobile/firefox-ios

# Issues (not PRs) with any of these labels are bugs.
bug_labels: ["Bug 🐞", "Bug", "bug-🐞", "Crash", "Regression"]
escaped:
  # The team = members of these GitHub teams. Everyone else counts as external (escaped), including org members
  # outside these teams (e.g. Mozillians from other teams filing bugs as users). Membership is read from GitHub at
  # run time and never stored: it needs a token with read:org (GH_ORG_READ_TOKEN in CI, or the `gh` CLI locally).
  team_org: mozilla-mobile
  team_teams: [firefox-ios-codeowners, firefox-ios-contributors, firefox-ios-pm, firefox-ios-tech-leads,
               firefox-ios-admins, fxios-automation-1, fxios-general-owners, fxios-unit-test-owners, firefox-ios-l10n,
               fxios-a-s, qa, sv-qa, sv-eng]
  # Service accounts, not people: their issues are never escaped bugs.
  bot_logins: [data-sync-user]
  # Who can set a bug's feature with a "Feature affected:" comment.
  tag_associations: [MEMBER, COLLABORATOR, OWNER]
# Test and spam issues, dropped before anything else: a title containing one of these phrases, a single short
# word, or only an email address or URL.
spam_phrases: ["please ignore", "testing unito", "integration test"]

# Suggestions only (first match wins), used to propose a decision for a new bug.
title_hints:
  - {match: "fill link from clipboard|clipboard suggestion", feature: SRCH.URL}
  - {match: "\\bpdfs?\\b|print", feature: BRW.PDF}
  - {match: "reader (mode|view)", feature: BRW.READ}
  - {match: "find in page|find bar", feature: BRW.FIND}
  - {match: "\\bzoom|desktop (site|mode)|request desktop", feature: BRW.ZOOM}
  - {match: "picture.in.picture|\\bpip\\b|video|audio|media|autoplay|fullscreen", feature: BRW.MEDIA}
  - {match: "error page|offline|no (internet|network)|wayback", feature: BRW.ERR}
  - {match: "open(ing)? (link|links) in (app|apps)|app links?|intent", feature: BRW.LINKS}
  - {match: "report broken site|webcompat|web compat", feature: BRW.WEBC}
  - {match: "text selection|select(ed|ing)? text|copy|paste|clipboard|context menu|long.press|\\bime\\b|keyboard", feature: BRW.CTX}
  - {match: "password generator|generate(d)? password", feature: CRED.GEN}
  - {match: "passkey|webauthn", feature: CRED.PASSKEY}
  - {match: "password|\\blogins?\\b", feature: CRED.PW}
  - {match: "credit card|payment method", feature: CRED.CC}
  - {match: "address(es)? (autofill|form|bar autofill)|autofill.*address|saved address", feature: CRED.ADDR}
  - {match: "relay|email mask", feature: CRED.MASK}
  - {match: "send tab|synced tab", feature: ACCT.SEND}
  - {match: "\\bsync", feature: ACCT.SYNC}
  - {match: "sign.?in|sign.?out|log.?in to|mozilla account|firefox account|\\bfxa\\b|pairing", feature: ACCT.SIGN}
  - {match: "summar", feature: AI.SUM}
  - {match: "ai control|block ai", feature: AI.CTRL}
  - {match: "translat", feature: TRANS.PAGE}
  - {match: "tab strip|tabstrip", feature: TABS.STRIP}
  - {match: "inactive tab|recently closed", feature: TABS.CLOSED}
  - {match: "tab group|collection", feature: TABS.GRP}
  - {match: "biometric|fingerprint|private (mode|browsing)? ?lock|lock private", feature: PRIV.LOCK}
  - {match: "private (tab|mode|browsing)|\\bpbm\\b|incognito", feature: PRIV.MODE}
  - {match: "tracking protection|\\betp\\b|trust panel|unified trust|tracker", feature: PROT.ETP}
  - {match: "cookie banner|ad ?block", feature: PROT.ADB}
  - {match: "https|certificate|\\bssl\\b|\\btls\\b|site identity|\\bdoh\\b", feature: PROT.HTTPS}
  - {match: "permission|location|camera|microphone|notification prompt", feature: PROT.PERM}
  - {match: "delete browsing data|clear (data|history|cache)|delete.*on quit", feature: PROT.CLEAR}
  - {match: "ip protection|\\bvpn\\b", feature: PROT.VPN}
  - {match: "wallpaper", feature: HOME.WALL}
  - {match: "\\bstor(y|ies)\\b|pocket|discover", feature: HOME.STORY}
  - {match: "shortcut|top site", feature: HOME.SC}
  - {match: "jump back|recent(ly)? (visited|tabs|saved|bookmarks)|task continuity", feature: HOME.JBI}
  - {match: "homepage|home ?screen|new tab page", feature: HOME.SET}
  - {match: "bookmark", feature: LIB.BMK}
  - {match: "history", feature: LIB.HIST}
  - {match: "download", feature: LIB.DL}
  - {match: "search suggest|firefox suggest|suggestion", feature: SRCH.SUG}
  - {match: "trending|recent search", feature: SRCH.REC}
  - {match: "qr code|\\bqr\\b|voice search|google lens", feature: SRCH.VIS}
  - {match: "search engine|default search|search shortcut|search provider", feature: SRCH.ENG}
  - {match: "address bar|url ?bar|autocomplete|awesomebar|\\burl\\b", feature: SRCH.URL}
  - {match: "toolbar|navigation bar|nav bar", feature: UI.TB}
  - {match: "\\bmenu\\b|three.dot|app menu", feature: UI.MENU}
  - {match: "snackbar|toast", feature: UI.TOAST}
  - {match: "swipe|gesture", feature: UI.GEST}
  - {match: "onboarding|first run|welcome", feature: ENG.ONB}
  - {match: "terms of use|\\btou\\b", feature: ENG.TOU}
  - {match: "microsurvey|survey|rating prompt", feature: ENG.SURV}
  - {match: "notification", feature: ENG.NOTIF}
  - {match: "\\bcfr\\b|message|banner", feature: ENG.CFR}
  - {match: "share sheet|\\bshare\\b", feature: OS.SHARE}
  - {match: "widget", feature: OS.WID}
  - {match: "default browser", feature: OS.DEF}
  - {match: "custom tab|\\bpwa\\b|web app", feature: OS.CTAB}
  - {match: "add-?on|extension", feature: EXT.ADDON}
  - {match: "dark (mode|theme)|light theme|\\btheme|color|colour|icon", feature: SET.THEME}
  - {match: "language|locale", feature: SET.LANG}
  - {match: "setting", feature: SET.FRAME}
  - {match: "crash report", feature: APP.CRASH}
  - {match: "session restore|restore tabs|data loss", feature: APP.SESS}
  - {match: "\\btabs?\\b", feature: TABS.TRAY}

