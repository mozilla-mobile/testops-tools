# Mobile feature health dashboard: per L1/L2 feature of the Firefox Mobile feature taxonomy, iOS next to Android,
# TestRail cases and UI automation next to this year's escaped bugs. Rebuilt from live data and deployed to Quick.
#
# Same deploy as mobile-testing-assessment-charts.yml (itself based on tr-critical-dashboard.yml / 'quick gha'):
#   - Runs weekly and manually, not on every push to main. Every run rebuilds all the data, so --mirror is safe.
#   - One collect step builds every data file (mobile-feature-health/collect.py). If a source fails, the others are
#     still deployed and the page says which columns have no data; the run then fails so someone notices.
#   - On pull requests touching the dashboard or the maps it reads: unit tests only, no network, no deploy.
#   - Data files are only written to the site (staff-only behind IAP), never committed: this repo is public. TestRail
#     data is aggregate counts only; bugs are public on Bugzilla / GitHub, so their IDs and titles are listed.
#
# Requires: the org-level Actions variable GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER and this repo's entry in
# noninternal_gha_repos in Quick's tf/<env>/main.tf (already there for tr-critical). The site is created on the
# first run. Set a repository Actions variable QUICK_ENV=stage to deploy to nonprod.
name: Mobile feature health dashboard

on:
  schedule:
    # Mondays 13:00 UTC, after the taxonomy drift report (06:00) and the assessment charts (12:00).
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Overwrite even if the site was last deployed by someone else
        type: boolean
        default: false
      coverage_branch:
        description: firefox-ios branch whose Bitrise unit-test coverage to read (to try a workflow change)
        type: string
        default: main
  pull_request:
    paths:
      - "mobile-feature-health/**"
      - "mobile-feature-taxonomy/testrail_map.py"
      - "mobile-feature-taxonomy/bugs_map.py"
      - "mobile-feature-taxonomy/feature_map.py"
      - "mobile-feature-taxonomy/*/feature-map.yml"
      - "mobile-feature-taxonomy/*/bugs-map.yml"
      - "mobile-feature-taxonomy/features.yml"
      - ".github/workflows/mobile-feature-health.yml"

permissions:
  contents: read

concurrency:
  group: mobile-feature-health-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r mobile-feature-taxonomy/requirements.txt
      - run: python -m unittest discover -s mobile-feature-health/tests -p 'test_*.py' -v

  deploy:
    name: Build and deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DIR: mobile-feature-health/site
      SITE: mte-mobile-feature-health
      QUICK_DEPLOYED_BY: github:${{ github.repository }}
      QUICK_PROJECT: ${{ vars.QUICK_ENV == 'stage' && 'moz-fx-quick-nonprod' || 'moz-fx-quick-prod' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r mobile-feature-taxonomy/requirements.txt

      # TestRail: cases and automation per feature. Bugzilla (Android): public API. GitHub (iOS issues): this
      # workflow's token, read-only on public repos. Who is in the iOS/QA teams: the IOS_TEAM_LOGINS secret, refreshed
      # by a repo admin with `uv run mobile-feature-taxonomy/bugs_map.py ios team --update-secret` (this token can't
      # read org teams); a GH_ORG_READ_TOKEN with read:org, if one is ever added, is used instead.
      # iOS unit-test coverage: the unit-test-coverage.json artifact of the weekly Bitrise workflow
      # firefox_unit_tests_ios_versions (Tuesdays), read with a Bitrise token that can read the firefox-ios app.
      - name: Collect TestRail cases, escaped bugs and unit-test coverage
        env:
          TESTRAIL_HOST: ${{ secrets.TESTRAIL_HOST }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          TESTRAIL_PASSWORD: ${{ secrets.TESTRAIL_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_ORG_READ_TOKEN: ${{ secrets.GH_ORG_READ_TOKEN }}
          IOS_TEAM_LOGINS: ${{ secrets.IOS_TEAM_LOGINS }}
          BITRISE_TOKEN: ${{ secrets.BITRISE_TOKEN }}
          BITRISE_APP_SLUG: ${{ secrets.BITRISE_APP_ID }}   # the firefox-ios app (also used by check-bitrise-ios-release-tags.yml)
          BITRISE_COVERAGE_BRANCH: ${{ inputs.coverage_branch || 'main' }}
        run: python mobile-feature-health/collect.py --out-dir "$DIR/data" --allow-partial

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: quick-gha-deploy@${{ env.QUICK_PROJECT }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Quick
        run: |
          gcloud storage cp "gs://${QUICK_PROJECT}-cli/quick-linux-amd64" "$RUNNER_TEMP/quick"
          chmod +x "$RUNNER_TEMP/quick"
          "$RUNNER_TEMP/quick" deploy "$DIR" "$SITE" --mirror ${{ inputs.force && '--yes' || '' }}
          echo "Deployed: https://${SITE}.quick.mozilla.cloud/" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if a data source couldn't be refreshed
        run: |
          python - <<'EOF'
          import json, sys
          status = json.load(open("mobile-feature-health/site/data/status.json"))
          failed = [k for k, v in status["sources"].items() if not v["ok"]]
          if failed:
              sys.exit(f"Deployed without fresh data for: {', '.join(failed)} (see the collect step)")
          EOF
