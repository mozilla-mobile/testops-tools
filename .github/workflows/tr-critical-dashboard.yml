# Critical test automation dashboard: pull TestRail, deploy to Quick.
#
# Based on the workflow generated by 'quick gha'. Changes from that file:
#   - Runs on a schedule (and manually), NOT on every push to main, so a
#     merge of unrelated tooling never redeploys the dashboard.
#   - Restores yesterday's history from the site, pulls fresh numbers from
#     TestRail, then deploys.
#   - Deploys only tr-critical/site, not the whole repo.
#   - Uses a fixed site name, so other Quick sites in this repo can't collide.
#
# History lives on the site itself (staff-only behind IAP), never in this
# repo, which is public. Each run reads metrics.csv and tr-state.json back
# from the sites bucket, adds today's row, and deploys them again.
#
# Requires: the org-level Actions variable GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER,
# and - because this repo is public - an entry in noninternal_gha_repos in
# Quick's tf/<env>/main.tf.
#
# First deploy: run it manually with bootstrap=true, since there is no
# history to restore yet. Every run after that must find the history.
#
# Set a repository Actions variable QUICK_ENV=stage to deploy to nonprod.
name: tr-critical dashboard

on:
  schedule:
    # Weekdays 11:30 UTC = 7:30 ET (6:30 ET in winter). Cron is always UTC.
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First deploy only - start without previous history
        type: boolean
        default: false
      force:
        description: Overwrite even if the site was last deployed by someone else
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# One run at a time; a manual run during a scheduled one waits rather than
# racing it to the same site.
concurrency:
  group: tr-critical-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DIR: tr-critical/site
      SITE: mte-testrail-critical
      QUICK_DEPLOYED_BY: github:${{ github.repository }}
      # Quick project: nonprod only when the QUICK_ENV variable is 'stage'; prod otherwise.
      QUICK_PROJECT: ${{ vars.QUICK_ENV == 'stage' && 'moz-fx-quick-nonprod' || 'moz-fx-quick-prod' }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: quick-gha-deploy@${{ env.QUICK_PROJECT }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # --mirror deletes site files that are not in $DIR. If history could
      # not be read and the run carried on, the deploy would wipe it. So a
      # failed read stops the run, unless this is the first deploy.
      - name: Restore history from the site
        env:
          BOOTSTRAP: ${{ inputs.bootstrap && 'true' || 'false' }}
        run: |
          mkdir -p "$DIR"
          for f in metrics.csv tr-state.json; do
            src="gs://${QUICK_PROJECT}-sites/${SITE}/${f}"
            if gcloud storage cp "$src" "$DIR/$f" --quiet; then
              echo "Restored $f"
            elif [ "$BOOTSTRAP" = "true" ]; then
              echo "Bootstrap run: no previous $f, starting fresh"
            else
              echo "::error::Could not read $src. Refusing to deploy over the site's history. For the very first deploy, run manually with bootstrap=true."
              exit 1
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull TestRail metrics
        working-directory: tr-critical
        env:
          TESTRAIL_HOST: ${{ secrets.TESTRAIL_HOST }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          TESTRAIL_PASSWORD: ${{ secrets.TESTRAIL_PASSWORD }}
        run: |
          pip install requests
          # The report lists case IDs and titles. This repo is public, so its
          # Actions logs are too: keep the report out of the log.
          python tr-critical.py --csv site/metrics.csv --state site/tr-state.json \
            --json site/latest.json > "$RUNNER_TEMP/report.txt"
          echo "metrics.csv now has $(($(wc -l < site/metrics.csv) - 1)) rows"

      - name: Deploy to Quick
        run: |
          gcloud storage cp "gs://${QUICK_PROJECT}-cli/quick-linux-amd64" "$RUNNER_TEMP/quick"
          chmod +x "$RUNNER_TEMP/quick"
          "$RUNNER_TEMP/quick" deploy "$DIR" "$SITE" --mirror ${{ inputs.force && '--yes' || '' }}
